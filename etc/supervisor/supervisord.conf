[supervisord]
nodaemon=true
user=root                       ; 明確指定以 root 執行以消除警告(已是 root 且沒被限制權限)
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock   ; supervisord 控制用的 socket 路徑

# RPC 介面設定（解決 supervisorctl 報錯的關鍵）
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock ; 使用 Unix socket 與 supervisord 通訊
; 或者如果您是用網路連接埠，也可以用 serverurl=http://127.0.0.1:9001
; 這是要讓 supervisorctl tool 知道要透過哪一個管道去跟背景的守護行程對話。

# systemd 預設會透過 journald 自動攔截服務的 stdout、stderr 以及 Syslog 訊息；
# 而 supervisord 只能透過讀取子程序的 stdout 和 stderr 來寫入指定的 log 檔案。
# 要讓 supervisord 蒐集原本在 systemd 底下執行的服務日誌，核心關鍵是將這些應用程式與服務的日誌
# 輸出改成寫到標準輸出（stdout）與標準錯誤（stderr）, 但是不是每個應用程式都有支援.
# 若可以的話, 可搭配下面的template範例，將 stdout/stderr 重新導向到 supervisord 的 log 檔案中，
# 這樣就能輕鬆的用 docker compose logs 或 docker logs 來查看容器的日誌輸出，而不需要再額外去找 log 檔案了。
# 但是, postfix 與 dovecot 剛好不行 ...
# ----- template -----
# [program:my_service]
# command=/path/to/your/app --foreground
# autostart=true
# autorestart=true
#
# ; 1. 指定標準輸出 (stdout) 的日誌路徑
# stdout_logfile=/var/log/supervisor/my_service.out.log
# stdout_logfile_maxbytes=50MB
# stdout_logfile_backups=10
#
# ; 2. 指定標準錯誤 (stderr) 的日誌路徑
# stderr_logfile=/var/log/supervisor/my_service.err.log
# stderr_logfile_maxbytes=50MB
# stderr_logfile_backups=10
#
# ; 3. (選用) 如果你想把 stdout 和 stderr 合併到同一個檔案，取消下面這行的註解
# ; redirect_stderr=true

[program:postfix]
# 修正 Postfix 的啟動指令（使用 /usr/lib/postfix/sbin/master -d 讓它穩定在背景運行）
command=/usr/lib/postfix/sbin/master -d
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dovecot]
# Dovecot 帶 -F 參數代表在 Foreground 運行
command=/usr/sbin/dovecot -F
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0