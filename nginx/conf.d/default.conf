server {
    listen 80;
    server_name mydomain.com; # 請記得替換成您的實際網域名稱

    # 攔截 Let's Encrypt 驗證請求，對應到共用的 webroot 資料夾
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他預設網頁回應
    location / {
        return 200 "Mail Server & Nginx Proxy are running successfully!";
        add_header Content-Type text/plain;
    }
}
